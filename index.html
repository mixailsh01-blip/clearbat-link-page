<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClearBat Launcher</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #openBtn {
      border: 1px solid #3a3a3a;
      background: #101010;
      color: #fff;
      border-radius: 10px;
      padding: 12px 16px;
      font: 600 14px/1.2 Arial, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="fallback">
    <button id="openBtn" type="button">Открыть CLEAR.bat</button>
  </div>

  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function normalizeType(type) {
      return type.trim() || "iiko";
    }

    function buildClearbatUrl() {
      const type = normalizeType(getParam("type"));
      const url = getParam("url").trim();
      const login = getParam("login").trim();
      const password = getParam("password");
      const format = (getParam("format") || "v2").trim().toLowerCase();
      const encodeMode = (getParam("encode") || "").trim().toLowerCase();

      if (!url) return null;

      if (format === "v2") {
        if (encodeMode === "password") {
          const encodedPassword = btoa(unescape(encodeURIComponent(password || "")));
          return `clearbat:/?type=${type}?url=${url}?login=${login}?password=${encodedPassword}?encode=password`;
        }

        return `clearbat:/?type=${type}?url=${url}?login=${login}?password=${password || ""}`;
      }

      if (!login || !password) {
        return `clearbat://${type}@${url}@`;
      }

      return `clearbat://${type}@${url}@${login}:${password}`;
    }

    function tryLaunch(url) {
      window.location.href = url;

      setTimeout(() => {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = url;
        document.body.appendChild(iframe);
      }, 250);

      setTimeout(() => {
        try {
          window.open("", "_self");
          window.close();
        } catch (e) {}
      }, 5000);

      // Chrome often blocks direct close() for non-script-opened tabs.
      // This fallback leaves an empty page if closing is denied.
      setTimeout(() => {
        try {
          if (!document.hidden) {
            window.location.replace("about:blank");
            setTimeout(() => {
              try {
                window.close();
              } catch (e) {}
            }, 60);
          }
        } catch (e) {}
      }, 5600);
    }

    const clearbatUrl = buildClearbatUrl();
    const fallback = document.getElementById("fallback");
    const openBtn = document.getElementById("openBtn");

    if (clearbatUrl) {
      openBtn.addEventListener("click", () => tryLaunch(clearbatUrl));
      tryLaunch(clearbatUrl);

      setTimeout(() => {
        fallback.style.display = "flex";
      }, 1400);
    }
  </script>
</body>
</html>

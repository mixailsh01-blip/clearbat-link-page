<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClearBat Launcher</title>
</head>
<body>
  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function normalizeType(type) {
      return type.trim() || "iiko";
    }

    function buildClearbatUrl() {
      const type = normalizeType(getParam("type"));
      const url = getParam("url").trim();
      const login = getParam("login").trim();
      const password = getParam("password");
      const format = (getParam("format") || "v2").trim().toLowerCase();
      const encodeMode = (getParam("encode") || "").trim().toLowerCase();

      if (!url) {
        return null;
      }

      if (format === "v2") {
        const parts = [
          `type=${encodeURIComponent(type)}`,
          `url=${encodeURIComponent(url)}`
        ];

        if (login) parts.push(`login=${encodeURIComponent(login)}`);
        if (password) parts.push(`password=${encodeURIComponent(password)}`);

        if (encodeMode === "password") {
          const encodedPassword = btoa(unescape(encodeURIComponent(password || "")));
          return `clearbat:/?type=${encodeURIComponent(type)}?url=${encodeURIComponent(url)}?login=${encodeURIComponent(login)}?password=${encodedPassword}?encode=password`;
        }

        return `clearbat:/?${parts.join("?")}`;
      }

      if (!login || !password) {
        return `clearbat://${type}@${url}@`;
      }

      return `clearbat://${type}@${url}@${login}:${password}`;
    }

    function launch(url) {
      // Some browsers handle custom protocols more reliably via direct href assignment.
      window.location.href = url;
    }

    const clearbatUrl = buildClearbatUrl();
    if (clearbatUrl) {
      setTimeout(() => launch(clearbatUrl), 150);
    }
  </script>
</body>
</html>

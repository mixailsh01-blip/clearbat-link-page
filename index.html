<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClearBat Launcher</title>
  <style>
    :root {
      --bg: #000;
      --panel: #0f0f12;
      --line: #2a2a31;
      --text: #f2f2f2;
      --muted: #a8a8b3;
      --accent: #1f6feb;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    #app {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .panel {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 10px;
    }

    .muted {
      color: var(--muted);
      margin: 0 0 14px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    button {
      border: 1px solid #3a3a44;
      background: #17171d;
      color: #fff;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover { border-color: var(--accent); }

    #status {
      color: var(--muted);
      font-size: 14px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main id="app">
    <section class="panel hidden" id="aspiaPanel">
      <h1>Подключения Aspia</h1>
      <p class="muted">Выбери кассу для запуска CLEAR.bat</p>
      <div class="grid" id="buttons"></div>
    </section>
    <div id="status">Подготовка...</div>
  </main>

  <script>
    const WEBHOOK_URL = "https://quumahienot.beget.app/webhook/RemoteDesktop";
    const ASPIA_LOGIN = "PosService";
    const ASPIA_PASSWORD = "fencjhcbyu1";

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function normalizeType(type) {
      return type.trim() || "iiko";
    }

    function buildClearbatUrl() {
      const type = normalizeType(getParam("type"));
      const url = getParam("url").trim();
      const login = getParam("login").trim();
      const password = getParam("password");
      const format = (getParam("format") || "v2").trim().toLowerCase();
      const encodeMode = (getParam("encode") || "").trim().toLowerCase();

      if (!url) return null;

      if (format === "v2") {
        if (encodeMode === "password") {
          const encodedPassword = btoa(unescape(encodeURIComponent(password || "")));
          return `clearbat:/?type=${type}?url=${url}?login=${login}?password=${encodedPassword}?encode=password`;
        }

        return `clearbat:/?type=${type}?url=${url}?login=${login}?password=${password || ""}`;
      }

      if (!login || !password) return `clearbat://${type}@${url}@`;
      return `clearbat://${type}@${url}@${login}:${password}`;
    }

    function buildAspiaClearbatUrl(ip) {
      return `clearbat://aspia@${ip}@${ASPIA_LOGIN}:${ASPIA_PASSWORD}`;
    }

    function buildAspiaV2FallbackUrl(ip) {
      return `clearbat:/?type=aspia?url=${ip}?login=${ASPIA_LOGIN}?password=${ASPIA_PASSWORD}`;
    }

    function tryLaunch(url) {
      window.location.href = url;
      setTimeout(() => {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = url;
        document.body.appendChild(iframe);
      }, 220);
      setTimeout(() => {
        try {
          window.open("", "_self");
          window.close();
        } catch (e) {}
      }, 5000);
    }

    function tryLaunchAspia(ip) {
      tryLaunch(buildAspiaClearbatUrl(ip));
      setTimeout(() => {
        tryLaunch(buildAspiaV2FallbackUrl(ip));
      }, 450);
    }

    async function fetchAspiaList() {
      const type = normalizeType(getParam("type")).toLowerCase();
      const tasks = getParam("tasks").trim();
      const resp = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, tasks })
      });
      if (!resp.ok) throw new Error("Webhook error " + resp.status);
      return resp.json();
    }

    function renderAspiaButtons(items) {
      const panel = document.getElementById("aspiaPanel");
      const buttons = document.getElementById("buttons");
      const status = document.getElementById("status");

      buttons.innerHTML = "";
      items.forEach((obj) => {
        const entries = Object.entries(obj || {});
        if (!entries.length) return;
        const name = entries[0][0];
        const ip = entries[0][1];

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = name;
        btn.addEventListener("click", () => {
          tryLaunchAspia(ip);
        });
        buttons.appendChild(btn);
      });

      panel.classList.remove("hidden");
      status.classList.add("hidden");
    }

    async function init() {
      const type = normalizeType(getParam("type")).toLowerCase();
      const status = document.getElementById("status");

      if (type === "aspia") {
        try {
          status.textContent = "Загрузка списка подключений...";
          const data = await fetchAspiaList();
          renderAspiaButtons(Array.isArray(data) ? data : []);
        } catch (e) {
          status.textContent = "Не удалось загрузить подключения.";
        }
        return;
      }

      const clearbatUrl = buildClearbatUrl();
      if (!clearbatUrl) {
        status.textContent = "Недостаточно параметров для запуска.";
        return;
      }

      tryLaunch(clearbatUrl);
      status.textContent = "Запуск...";
    }

    init();
  </script>
</body>
</html>
